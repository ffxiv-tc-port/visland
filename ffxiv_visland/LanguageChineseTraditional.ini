Earliest-cycle placement is ON.==「請求盡量排在最早的生產日」已啟用。
Earliest-cycle placement is OFF - requests only use the cycles the archive covers.==「請求盡量排在最早的生產日」未啟用——請求只會用到封存排程涵蓋的生產日。
Put requests on the earliest cycles==請求盡量排在最早的生產日
Requests are placed from cycle 1 onwards instead of only on the cycles the archive covers. Needs "Fill the cycles the archive leaves empty" and a favour mode other than None - the archive starts at cycle 2, so without the filled cycles there is no earlier day to use. In the min-max modes this replaces the value-based day ordering with plain earliest-first.==請求會從第 1 生產日開始往後放,而不是只放在封存排程涵蓋的那幾天。需要同時開啟「補上封存排程沒有安排的生產日」,而且請求模式不能是「不整合」——封存排程從第 2 生產日才開始,沒有補出來的生產日就沒有更早的日子可以用。在極限最佳化模式下,這會取代原本「照價值由低到高」的排放順序,改成單純由早到晚。
The game gives you the whole week to fill a request, so this does not earn more; it buys margin and shows the cost on the Schedule tab.==遊戲給的期限就是整個週期,所以這不會多賺;換到的是餘裕,代價會顯示在排程分頁。
